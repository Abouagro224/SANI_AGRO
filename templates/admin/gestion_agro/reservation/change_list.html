{% extends "admin/change_list.html" %}

{% block content %}
    <div style="background: linear-gradient(90deg, #003049, #0077b6); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.3); border: 2px solid #fcbf49;">
        
        <h2 style="margin: 0; font-family: 'Segoe UI', sans-serif; text-transform: uppercase; letter-spacing: 2px;">
            📊 Pilotage des Flux : Collecte & Trésorerie
        </h2>

        <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 15px;">
            
            <div>
                <p style="margin: 0; font-size: 1.1em; opacity: 0.9;">Volume Mobilisé</p>
                <span style="font-size: 1.8em; font-weight: bold;">{{ tonnage|floatformat:2 }} Tonnes</span>
            </div>
            
            <div style="height: 50px; width: 2px; background: rgba(255,255,255,0.3);"></div>
            
            <div style="background: rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 10px; border: 1px dashed #fcbf49;">
                <p style="margin: 0; font-size: 1em; font-weight: bold; color: #fcbf49;">💵 CAISSE (Cautions)</p>
                <span style="font-size: 2.2em; font-weight: bold;">{{ total_cautions }} FCFA</span>
            </div>

            <div style="height: 50px; width: 2px; background: rgba(255,255,255,0.3);"></div>

            <div>
                <p style="margin: 0; font-size: 1.1em; opacity: 0.9;">Valeur Marchande</p>
                <span style="font-size: 1.8em; font-weight: bold; color: #00d4ff;">{{ ca_total }} FCFA</span>
            </div>
        </div>
    </div>

    {{ block.super }}
{% endblock %}
