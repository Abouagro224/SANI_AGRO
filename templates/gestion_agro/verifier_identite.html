{% extends 'gestion_agro/base.html' %}
{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white;">
    <h2 style="color: #1a237e;">🛡️ Vérification d'identité</h2>
    <p>Pour utiliser toutes les fonctionnalités, vous devez faire vérifier votre identité.</p>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Type de pièce :</label>
        <select name="type_piece" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">
            <option value="CARTE_IDENTITE">Carte d'identité</option>
            <option value="CARTE_BIOMETRIQUE">Carte Nina / Biométrique</option>
            <option value="PASSEPORT">Passeport</option>
            <option value="AUTRE">Autre pièce</option>
        </select>
        <label>N° de la pièce (optionnel) :</label>
        <input type="text" name="numero_piece" placeholder="N° de la pièce" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd;">
        <label>Photo de la pièce :</label>
        <input type="file" name="piece_identite" accept="image/*" required style="margin-bottom: 20px;">
        <button type="submit" style="background: #1a237e; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%;">📤 Envoyer</button>
    </form>
</div>
{% endblock %}
