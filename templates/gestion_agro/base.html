<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SANI-AGRO | Plateforme Logistique</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #f4f7f6; }
        nav { background: #0d47a1; color: white; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 20px; letter-spacing: 1px; }
        .content { padding: 20px; }
        .logout-btn { background: none; border: none; color: white; cursor: pointer; font-size: 12px; text-decoration: underline; }
        .admin-link { color: #ff9800; margin-right: 15px; text-decoration: none; font-weight: bold; }
        .admin-link:hover { color: #ffb74d; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SANI-AGRO 🇲🇱</div>
        <div>
            {% if request.user.is_superuser %}
                <a href="{% url 'dashboard_admin_stats' %}" class="admin-link">🔒 Admin</a>
            {% endif %}
            <strong>{{ request.user.username }}</strong>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Déconnexion</button>
            </form>
        </div>
    </nav>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS (optionnel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
