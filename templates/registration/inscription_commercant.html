<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANI-AGRO | Inscription Commerçant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --white: #ffffff; --text: #1e293b; --border: #e2e8f0; --shadow-lg: 0 10px 15px rgba(0,0,0,0.1); --radius: 12px; }
        body { background: linear-gradient(135deg, #eff6ff 0%, #f0f4ff 100%); font-family: 'Inter', sans-serif; padding: 40px 0; min-height: 100vh; }
        .form-card { background: var(--white); border-radius: 20px; padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); position: relative; overflow: hidden; }
        .form-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); }
        .helptext, ul.helptext { display: none; }
        .section-header { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--primary); letter-spacing: 1px; margin: 25px 0 15px; padding-bottom: 10px; border-bottom: 2px solid #f1f5f9; }
        .form-control { border-radius: var(--radius); padding: 12px 16px; border: 1px solid var(--border); background: var(--white); font-size: 0.95rem; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); outline: none; }
        label { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); border: none; border-radius: var(--radius); padding: 14px 24px; font-weight: 600; font-size: 1rem; transition: background 0.2s, transform 0.2s; color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        @media (max-width: 768px) { body { padding: 20px 10px; } .form-card { padding: 25px 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="form-card shadow-sm">
                    <div class="text-center mb-4">
                        <div style="background: rgba(37, 99, 235, 0.1); width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                            <i class="fas fa-store fa-2x" style="color: var(--primary);"></i>
                        </div>
                        <h2 class="fw-bold" style="color: #1e293b;">Espace Commerçant</h2>
                        <p class="text-muted">Développez votre réseau de vente avec SANI-AGRO</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="section-header">1. Vos identifiants</div>
                        <div class="mb-4">
                            {{ form.as_p }}
                        </div>

                        <div class="section-header">2. Détails du Commerce</div>
                        
                        <div class="mb-3">
                            <label>Nom complet</label>
                            <input type="text" name="nom_complet" class="form-control" placeholder="Ex: Aboubacar Doumbia" required>
                        </div>

                        <div class="mb-3">
                            <label><i class="fas fa-map-marker-alt me-2 text-primary"></i>Ville du marché</label>
                            <input type="text" name="ville_marche" class="form-control" placeholder="Ex: Bamako (Marché de Médine)" required>
                        </div>

                        <div class="mb-3">
                            <label><i class="fas fa-phone-alt me-2 text-primary"></i>Téléphone</label>
                            <input type="text" name="telephone" class="form-control" placeholder="Ex: +223 76 00 00 00" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Créer mon compte Commerçant <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="small text-muted">Déjà inscrit ? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Connexion</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
