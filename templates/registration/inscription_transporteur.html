<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANI-AGRO | Partenaire Transport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f57c00; --primary-hover: #e65100; --bg: #fffbf7; --white: #ffffff; --text: #1e293b; --border: #e0e0e0; --shadow-lg: 0 15px 35px rgba(245,124,0,0.1); --radius: 12px; }
        body { background: linear-gradient(135deg, #fff8f0 0%, #fff3e0 100%); font-family: 'Inter', sans-serif; padding: 40px 0; min-height: 100vh; }
        .form-card { background: var(--white); border-radius: 25px; padding: 40px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; border-top: 6px solid var(--primary); }
        .section-header { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--primary); letter-spacing: 1px; margin: 25px 0 15px; padding-bottom: 10px; border-bottom: 2px solid #ffe0b2; }
        .form-control { border-radius: var(--radius); padding: 12px 16px; border: 1.5px solid #eee; background: #fafafa; font-size: 0.95rem; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(245,124,0,0.1); outline: none; }
        label { font-weight: 600; color: var(--text); margin-bottom: 6px; font-size: 0.9rem; }
        .btn-transport { border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1rem; background: var(--primary); border: none; color: white; transition: background 0.2s, transform 0.2s; }
        .btn-transport:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .helptext { font-size: 0.75rem; color: #888; }
        .errorlist { color: #d32f2f; list-style: none; padding: 0; font-size: 0.8rem; }
        @media (max-width: 768px) { body { padding: 20px 10px; } .form-card { padding: 25px 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-10">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <div style="background: rgba(245,124,0,0.1); width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                            <i class="fas fa-truck-fast fa-2x" style="color: var(--primary);"></i>
                        </div>
                        <h2 class="fw-bold" style="color: #1e293b;">Espace Transporteur</h2>
                        <p class="text-muted">Optimisez vos trajets et boostez vos revenus</p>
                    </div>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="section-header"><i class="fas fa-user me-2"></i>1. Compte Utilisateur</div>
                        <div class="mb-4">
                            {{ form.as_p }}
                        </div>

                        <div class="section-header"><i class="fas fa-truck me-2"></i>2. Détails Logistiques</div>
                        
                        <div class="mb-3">
                            <label>Nom du Transporteur / Compagnie</label>
                            <input type="text" name="nom_compagnie" class="form-control" placeholder="Ex: Transports Doumbia Express" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Type de véhicule</label>
                                <input type="text" name="type_vehicule" class="form-control" placeholder="Ex: Camion 10 tonnes" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>N° Plaque d'immatriculation</label>
                                <input type="text" name="numero_plaque" class="form-control" placeholder="Ex: AM-1234-B2" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label><i class="fas fa-phone-alt me-2"></i>Téléphone</label>
                            <input type="text" name="telephone" class="form-control" placeholder="Ex: 76 45 59 92" required>
                        </div>

                        <div class="section-header"><i class="fas fa-camera me-2"></i>3. Photo de Profil</div>
                        <div class="mb-4">
                            <label>Photo du véhicule ou Profil</label>
                            <input type="file" name="photo_profil" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-transport w-100">
                            Activer mon profil transporteur <i class="fas fa-road ms-2"></i>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="small text-muted">Déjà inscrit ? <a href="{% url 'login' %}" class="text-warning fw-bold text-decoration-none">Connexion</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
