<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANI-AGRO | Inscription Producteur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2e7d32; --accent: #43a047; --bg: #f8faf9; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding: 40px 0; }
        .glass-card { background: white; border-radius: 28px; padding: 45px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .glass-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
        .form-control { border-radius: 14px; padding: 14px 20px; border: 2px solid #f0f2f1; background: #fcfdfe; }
        .btn-success { background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 16px; padding: 18px; font-weight: 700; }
        .error-box { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-10">
                <div class="glass-card">
                    
                    <!-- 1. AFFICHAGE DES ERREURS (POUR SAVOIR POURQUOI ÇA COINCE) -->
                    {% if form.errors %}
                        <div class="error-box">
                            <strong>Attention :</strong> Vérifiez vos accès (mot de passe trop court ou nom déjà pris).
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <div class="text-center mb-5">
                        <h2 class="fw-bold">SANI-AGRO Producteur</h2>
                        <p class="text-muted">Rejoignez la révolution agricole au Mali</p>
                    </div>

                    <!-- 2. ATTENTION : method="post" et enctype SONT OBLIGATOIRES -->
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="fw-bold mb-2">Identifiants de connexion</label>
                            {{ form.as_p }}
                        </div>

                        <hr>

                        <div class="mb-3">
                            <label><i class="fas fa-building me-2 text-success"></i>Nom Complet / Coopérative</label>
                            <input type="text" name="nom" class="form-control" placeholder="Ex: Bakary Diarra" required>
                        </div>

                        <div class="mb-3">
                            <label><i class="fas fa-home me-2 text-success"></i>Village / Commune</label>
                            <input type="text" name="village" class="form-control" placeholder="Ex: Koumantou" required>
                        </div>

                        <div class="mb-3">
                            <label><i class="fas fa-phone-alt me-2 text-success"></i>Téléphone</label>
                            <input type="text" name="telephone" class="form-control" placeholder="Ex: 76XXXXXX" required>
                        </div>

                        <div class="mb-4">
                            <label><i class="fas fa-camera me-2 text-success"></i>Photo de Profil</label>
                            <input type="file" name="photo_profil" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Créer mon profil Producteur <i class="fas fa-chevron-right ms-2"></i>
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="small text-muted">Déjà un compte ? <a href="{% url 'login' %}" class="text-success fw-bold">Se connecter</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
